<!DOCTYPE html>
<html lang="en" data-build="12.16">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Strict Content-Security-Policy: only same-origin code runs. Everything is
     vendored, so no third-party scripts, no inline scripts, no inline styles,
     and no network egress are permitted. 'wasm-unsafe-eval' is required to
     instantiate the MuPDF WebAssembly engine; blob:/data: cover locally
     generated page images and signatures. All CSS lives in styles.css and all
     dynamic styling goes through the CSSOM (el.style.x), so style-src can be
     'self'. This neutralises injected-script and injected-style attacks. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'wasm-unsafe-eval';
  style-src 'self';
  img-src 'self' blob: data:;
  media-src 'self' blob:;
  font-src 'self';
  connect-src 'self' blob: data:;
  worker-src 'self' blob:;
  manifest-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<meta name="referrer" content="no-referrer">
<!-- v11.17: dark form controls + dark iOS keyboard. The CSS root already sets
     color-scheme:dark, but WebKit reads this meta before CSS parses, which is
     what reliably flips the keyboard to dark in a standalone PWA. -->
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>PyPDF</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyPDF">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">

     splash on cold launch instead of a white flash. A universal CSS first-paint
     splash (#launch, below) covers any device/orientation not matched here. -->
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1320x2868-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1290x2796-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1206x2622-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1179x2556-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1284x2778-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1170x2532-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1125x2436-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/launch-1242x2688-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/launch-828x1792-dark.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/launch-750x1334-dark.png">
<!-- landscape variants (v10.89): without these a landscape cold launch flashed
     white; same devices, dimensions swapped -->
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2868x1320-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2796x1290-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2622x1206-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2556x1179-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2778x1284-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2532x1170-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2436x1125-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="./splash/launch-2688x1242-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./splash/launch-1792x828-dark-land.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./splash/launch-1334x750-dark-land.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Universal first-paint splash: painted instantly from cached CSS so there is
     no white flash on launch (covers any device/orientation the per-device
     apple-touch-startup-image set above doesn't match). app.js adds .gone to
     fade it out once the engine is ready. -->
<div class="launch" id="launch" aria-hidden="true">
  <img class="launch-logo" src="./icon-192.png" alt="">
  <span class="launch-spin"></span>
</div>
<header>
  <h1>PyPDF</h1>
  <div class="meta" id="meta"><span class="meta-name" id="metaName">Loading engine…</span><span class="meta-info" id="metaInfo"></span></div>
  <!-- v11.11: ✕ moved up here (iOS "Done" position); ID + handler unchanged -->
  <button class="xbtn" id="closeBtn" aria-label="Close this PDF" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6l-12 12"/></svg>
  </button>
</header>

<!-- v11.11 toolbar diet: five core actions + Open (Preview style). Edit /
     Select / Sign fold into a Markup popover (their IDs and handlers are
     unchanged — the buttons just live in #mkMenu now); Unlock and Compress
     keep their original buttons hidden below (the More sheet triggers them),
     so the build guard and every test still find the same IDs. -->
<div class="toolbar" id="toolbar">
  <button id="openBtn" class="tbtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2z"/></svg>
    <span>Open</span>
  </button>
  <button id="pagesBtn" class="tbtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v5h-5z"/><path d="M14 5h5v5h-5z"/><path d="M5 14h5v5h-5z"/><path d="M14 14h5v5h-5z"/></svg>
    <span>Pages</span>
  </button>
  <button id="markupBtn" class="tbtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10 -10a2 2 0 0 0 -4 -4l-10 10z"/><path d="M13.5 6.5l4 4"/></svg>
    <span>Markup</span>
  </button>
  <button id="findBtn" class="tbtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4 -4"/></svg>
    <span>Find</span>
  </button>
  <button id="saveBtn" class="tbtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9h-1a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-8a2 2 0 0 0 -2 -2h-1"/><path d="M12 14v-11"/><path d="M9 6l3 -3l3 3"/></svg>
    <span>Save</span>
  </button>
  <button id="moreBtn" class="tbtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
    <span>More</span>
  </button>
</div>

<!-- Markup popover: the three mode buttons, shown above the toolbar -->
<div class="mkmenu" id="mkMenu" hidden>
  <button class="segbtn" id="textBtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10 -10a2 2 0 0 0 -4 -4l-10 10z"/><path d="M13.5 6.5l4 4"/></svg>
    <span>Edit text</span>
  </button>
  <button class="segbtn" id="selectBtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16"/><path d="M9 4h6"/><path d="M9 20h6"/><path d="M5 9v6"/><path d="M19 9v6"/></svg>
    <span>Select</span>
  </button>
  <button class="segbtn" id="signBtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c3 0 5 -10 7 -10c1 0 1 4 2 4c1 0 2 -2 3 -2"/><path d="M4 21h16"/></svg>
    <span>Sign</span>
  </button>
  <!-- v11.47: fill real form fields (AcroForm) -->
  <button class="segbtn" id="formBtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="5" rx="1"/><rect x="4" y="14" width="5" height="5" rx="1"/><path d="M5.5 16.5l1.2 1.2l2 -2.4"/></svg>
    <span>Form</span>
  </button>
  <!-- v11.43: whiteout — drag a box that is painted opaque white -->
  <button class="segbtn" id="whiteBtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="14" height="10" rx="1"/><path d="M8 4l3 3"/><path d="M13 4l3 3"/></svg>
    <span>Whiteout</span>
  </button>
  <!-- v11.43: place a picture from Photos on the page (same drag-a-box flow as Sign) -->
  <button class="segbtn" id="imgPlaceBtn" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5 -4l3 3l4 -4l4 4"/></svg>
    <span>Image</span>
  </button>
</div>
<input type="file" id="insImgInput" accept="image/*" hidden>

<!-- Legacy action buttons: hidden but kept in the DOM (build guard + tests +
     handlers); the More sheet's Compress / Unlock tiles trigger them. -->
<span hidden>
  <button id="unlockBtn" disabled>Unlock</button>
  <button id="compBtn" disabled>Compress</button>
</span>

<!-- Find-in-PDF bar. Hidden until opened from More → Find. Lives between the
     toolbar and the viewer so it never overlaps the pages. All wiring is in
     app.js; styling in styles.css (CSP style-src 'self'). -->
<div class="findbar" id="findbar" hidden>
  <svg class="ic fic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4 -4"/></svg>
  <input type="text" id="findInput" inputmode="search" enterkeyhint="search"
         autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="Find in document" aria-label="Find in document">
  <button class="fclear" id="findClear" aria-label="Clear search" hidden>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
  </button>
  <span class="fcount" id="findCount" aria-live="polite"></span>
  <button class="fnav" id="findPrev" aria-label="Previous match" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6 -6l6 6"/></svg>
  </button>
  <button class="fnav" id="findNext" aria-label="Next match" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg>
  </button>
  <button class="fnav" id="findClose" aria-label="Close find">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6l-12 12"/></svg>
  </button>
</div>

<div class="viewer" id="viewer">
  <div class="empty" id="emptyMsg">
    <div class="welcome">
      <p class="wtitle">PyPDF</p>
      <!-- v11.10: the three actions sit side-by-side as compact tiles so the
           recents thumbnail grid below gets the vertical room -->
      <div class="wactions">
      <button class="big" id="bigOpen" disabled>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2z"/></svg>
        <span>Open a PDF</span>
      </button>
      <button class="big ghost" id="bigScan" disabled>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h3l2 -2h4l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1v-9a1 1 0 0 1 1 -1z"/><path d="M12 17a3 3 0 1 0 0 -6a3 3 0 0 0 0 6z"/></svg>
        <span>Scan Document</span>
      </button>
      <button class="big ghost" id="bigPhotos" disabled>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path d="M4 16l5 -5l4 4l3 -3l4 4"/><path d="M14.5 8.5a1 1 0 1 0 0 .01"/></svg>
        <span>Photos to PDF</span>
      </button>
      </div>
      <p class="hint" id="welcomeHint">Getting ready…</p>
      <!-- recent files (filled by app.js renderRecents; hidden when empty) -->
      <div class="recents" id="recents" hidden></div>
    </div>
  </div>
  <!-- pages live in a wrapper so pinch-zoom can scale them instantly via CSS -->
  <div class="pagewrap" id="pageWrap"></div>
</div>

<div class="status" id="status" role="status" aria-live="polite">Loading…</div>

<input type="file" id="fileInput" accept="application/pdf,.pdf">
<input type="file" id="mergeInput" accept="application/pdf,.pdf" multiple>
<input type="file" id="unlockInput" accept="application/pdf,.pdf">
<input type="file" id="imgInput" accept="image/*" multiple>
<input type="file" id="sigInput" accept="image/*">
<!-- fallback when getUserMedia is unavailable/denied: native camera capture -->
<input type="file" id="camInput" accept="image/*" capture="environment">

<!-- ---------------- document scanner: camera screen ---------------- -->
<div class="scanui" id="scanCam" role="dialog" aria-modal="true" aria-label="Scan document">
  <div class="scantop">
    <!-- v11.71: press and hold this title for the camera diagnostic (what the
         stream reported, and how the preview was fitted). It was on the page
         counter, which is empty until a page exists — nothing to press. -->
    <span class="ttl" id="scanTitle">Scan document</span>
    <span class="tools">
      <!-- v11.32: auto capture on/off. Default on; the choice is remembered.
           With it on the shutter fires itself once the page is framed and
           still, and the Adjust screen is skipped; the shutter still works by
           hand and always goes through Adjust. -->
      <button class="ghost mini on" id="autoBtn" aria-pressed="true"
              aria-label="Automatic capture">Auto</button>
      <button class="ghost mini" id="torchBtn" aria-label="Camera torch" hidden>Torch</button>
      <span class="pgct" id="scanCount" aria-live="polite"></span>
    </span>
  </div>
  <div class="scanview" id="scanView">
    <!-- v11.69: shown in the reserved space until the first camera frame covers
         it, so the opening is one step instead of a resize people can see -->
    <div class="camboot" id="camBoot" aria-hidden="true">Starting camera…</div>
    <video id="scanVideo" autoplay playsinline muted aria-label="Camera preview"></video>
    <canvas class="quad" id="scanQuad" aria-hidden="true"></canvas>
    <!-- v10.94: brief white flash on capture (iOS-camera-style confirmation) -->
    <div class="scanflash" id="scanFlash" aria-hidden="true"></div>
  </div>
  <!-- v11.80: Type is chosen BEFORE the shutter, not after the capture. It
       decides how the page is processed and, in Photo ID, how it is framed and
       composited — so choosing it afterwards meant the preview and the
       auto-capture gate were working to a different set of rules from the
       result. Document is the default. -->
  <div class="scantype">
    <div class="fgrp">
      <span class="flab" id="typeLab">Type</span>
      <div class="seg" role="group" aria-labelledby="typeLab">
        <button id="enhToggle" class="on" aria-pressed="true">Document</button>
        <button id="idToggle" aria-pressed="false">Photo ID</button>
      </div>
    </div>
    <!-- v11.82: how many sides of the card, as a one-of pair rather than an
         on/off toggle — "Both sides" lit meant two, unlit meant one, which the
         button never actually said. Both sides is first and is the default.
         Sits directly BELOW Photo ID, same column, same styling, so it reads as
         a sub-option of that type. Hidden unless Photo ID is chosen. -->
    <div class="fgrp bothrow" id="bothRow" hidden>
      <span class="flab" aria-hidden="true"></span>
      <div class="seg" role="group" aria-label="How many sides of the card">
        <button id="idBothToggle" aria-pressed="true" class="on">Both sides</button>
        <button id="idSingleToggle" aria-pressed="false">Single side</button>
      </div>
    </div>
  </div>
  <!-- scanned pages so far — tap one to review or delete it -->
  <div class="scanthumbs" id="scanThumbs"></div>
  <div class="scanctl">
    <button class="ghost" id="scanCancel">Cancel</button>
    <button class="shutter" id="scanShot" aria-label="Capture"></button>
    <button id="scanDone" disabled>Create PDF</button>
  </div>
</div>

<!-- ---------------- document scanner: adjust / crop screen ---------------- -->
<div class="scanui" id="scanCrop" role="dialog" aria-modal="true" aria-label="Adjust edges">
  <div class="scantop">
    <span class="ttl">Adjust edges</span>
    <span class="tools">
      <span class="pgct" id="cropHint">Drag the box, its sides, or corners</span>
      <button class="ghost mini" id="cropReset" aria-label="Reset the crop to the full page">Reset</button>
    </span>
  </div>
  <div class="cropwrap" id="cropWrap">
    <canvas class="photo" id="cropPhoto"></canvas>
    <canvas class="loupe" id="loupe" width="120" height="120" aria-hidden="true" hidden></canvas>
    <svg id="cropSvg">
      <polygon id="cropPoly" points="0,0 0,0 0,0 0,0"></polygon>
      <!-- visible grips (g*) + invisible enlarged hit areas (h*) on top,
           so corners are easy to grab with a thumb -->
      <circle id="g0" class="hgrip" r="14"></circle><circle id="g1" class="hgrip" r="14"></circle>
      <circle id="g2" class="hgrip" r="14"></circle><circle id="g3" class="hgrip" r="14"></circle>
      <circle id="h0" class="hhit" r="28" role="button" aria-label="Drag the top left corner"></circle><circle id="h1" class="hhit" r="28" role="button" aria-label="Drag the top right corner"></circle>
      <circle id="h2" class="hhit" r="28" role="button" aria-label="Drag the bottom right corner"></circle><circle id="h3" class="hhit" r="28" role="button" aria-label="Drag the bottom left corner"></circle>
      <!-- edge (side-midpoint) grips: drag a whole side in/out -->
      <rect id="ge0" class="egrip" width="26" height="9" rx="4.5"></rect><rect id="ge1" class="egrip" width="9" height="26" rx="4.5"></rect>
      <rect id="ge2" class="egrip" width="26" height="9" rx="4.5"></rect><rect id="ge3" class="egrip" width="9" height="26" rx="4.5"></rect>
      <circle id="he0" class="hhit" r="26" role="button" aria-label="Drag the top edge"></circle><circle id="he1" class="hhit" r="26" role="button" aria-label="Drag the right edge"></circle>
      <circle id="he2" class="hhit" r="26" role="button" aria-label="Drag the bottom edge"></circle><circle id="he3" class="hhit" r="26" role="button" aria-label="Drag the left edge"></circle>
    </svg>
  </div>
  <!-- v11.69: this row used to be five identically-styled pills that were in
       fact four different KINDS of control — a one-of pair (Standard/Small
       file), two toggles that silently cancelled each other (Whiten/Photo ID),
       a three-way cycler that showed no value ("Colour"), and a picker. Now the
       shape carries the rule: a segment means pick one of these, a chip with a
       value means this setting currently holds that value. -->
  <!-- v11.80: Type moved to the camera screen, so only the output paper size
       is decided here. -->
  <div class="scanfilters">
    <div class="fvals">
      <button id="paperBtn" class="vchip" aria-label="Output paper size">
        <span class="k">Page</span><span class="v" id="paperVal">A4</span></button>
    </div>
  </div>
  <div class="scanctl">
    <button class="ghost" id="cropRetake">Retake</button>
    <button class="ghost" id="cropRotate" aria-label="Rotate the page a quarter turn">⟳ Rotate</button>
    <button id="cropUse">Use page</button>
  </div>
</div>

<div class="pgpill" id="pagePill" role="button" aria-label="Go to page"></div>

<!-- Floating zoom control. Moved out of the toolbar so it no longer vanishes on
     iPhone (the old `@media(max-width:599px){.zoomctl{display:none}}` hid it on
     every phone). IDs are unchanged; visibility is toggled by refreshZoomButtons
     via the .show class only while a document is open. -->
<div class="zoomctl" id="zoomctl">
  <button class="ghost" id="zoomOut" aria-label="Zoom out" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
  </button>
  <!-- v11.24: the % readout is a button — tapping it snaps back to 100% -->
  <button class="zlbl" id="zoomLbl" aria-label="Reset zoom to 100%">100%</button>
  <button class="ghost" id="zoomIn" aria-label="Zoom in" disabled>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
  </button>
</div>

<!-- Floating Undo — replaces the old toolbar Undo button (freeing a top-bar
     slot for Sign + Unlock). The ID is unchanged so all wiring and the test
     harness keep working; refreshUndo() reveals it (.show) only when there is
     something to undo, bottom-left so it clears the zoom pill and page pill. -->
<button class="undofab" id="undoBtn" aria-label="Undo" disabled>
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 13l-4 -4l4 -4"/><path d="M5 9h9a5 5 0 0 1 0 10h-3"/></svg>
  <span>Undo</span>
</button>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
