<!DOCTYPE html>
<html lang="en" data-build="10.11">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Strict Content-Security-Policy: only same-origin code runs. Everything is
     vendored, so no third-party scripts, no inline scripts, no inline styles,
     and no network egress are permitted. 'wasm-unsafe-eval' is required to
     instantiate the MuPDF WebAssembly engine; blob:/data: cover locally
     generated page images and signatures. All CSS lives in styles.css and all
     dynamic styling goes through the CSSOM (el.style.x), so style-src can be
     'self'. This neutralises injected-script and injected-style attacks. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'wasm-unsafe-eval';
  style-src 'self';
  img-src 'self' blob: data:;
  media-src 'self' blob:;
  font-src 'self';
  connect-src 'self' blob: data:;
  worker-src 'self' blob:;
  manifest-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>PyPDF</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyPDF">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <h1>PyPDF</h1>
  <div class="meta" id="meta">Loading engine…</div>
</header>

<div class="toolbar" id="toolbar">
  <button id="openBtn" disabled>Open</button>
  <button class="ghost" id="textBtn" disabled>Edit</button>
  <button class="ghost" id="undoBtn" disabled>Undo</button>
  <div class="zoomctl">
    <button class="ghost" id="zoomOut" aria-label="Zoom out" disabled>−</button>
    <span class="zlbl" id="zoomLbl">100%</span>
    <button class="ghost" id="zoomIn" aria-label="Zoom in" disabled>+</button>
  </div>
  <button class="ghost" id="compBtn" disabled>Compress</button>
  <button class="ghost" id="moreBtn" disabled>More ▾</button>
  <button id="saveBtn" disabled>Save</button>
</div>

<div class="viewer" id="viewer">
  <div class="empty" id="emptyMsg">
    <div class="welcome">
      <p class="wtitle">PyPDF</p>
      <button class="big" id="bigOpen" disabled>📄&ensp;Open a PDF</button>
      <button class="big ghost" id="bigScan" disabled>📷&ensp;Scan a document</button>
      <p class="hint" id="welcomeHint">Getting ready…</p>
    </div>
  </div>
  <!-- pages live in a wrapper so pinch-zoom can scale them instantly via CSS -->
  <div class="pagewrap" id="pageWrap"></div>
</div>

<div class="status" id="status" role="status" aria-live="polite">Loading…</div>

<input type="file" id="fileInput" accept="application/pdf,.pdf">
<input type="file" id="mergeInput" accept="application/pdf,.pdf" multiple>
<input type="file" id="imgInput" accept="image/*" multiple>
<input type="file" id="sigInput" accept="image/*">
<!-- fallback when getUserMedia is unavailable/denied: native camera capture -->
<input type="file" id="camInput" accept="image/*" capture="environment">
<!-- photo-library import into the scan pipeline (no capture attr = picker) -->
<input type="file" id="photoInput" accept="image/*">

<!-- ---------------- document scanner: camera screen ---------------- -->
<div class="scanui" id="scanCam">
  <div class="scantop">
    <span class="ttl">Scan document</span>
    <span class="tools">
      <button class="ghost mini" id="photoBtn">Photos</button>
      <button class="ghost mini" id="autoBtn" aria-label="Automatic capture">Auto</button>
      <button class="ghost mini" id="torchBtn" aria-label="Camera torch" hidden>Torch</button>
      <span class="pgct" id="scanCount"></span>
    </span>
  </div>
  <div class="scanview" id="scanView">
    <video id="scanVideo" autoplay playsinline muted aria-label="Camera preview"></video>
    <canvas class="quad" id="scanQuad" aria-hidden="true"></canvas>
  </div>
  <!-- scanned pages so far — tap one to review or delete it -->
  <div class="scanthumbs" id="scanThumbs"></div>
  <div class="scanctl">
    <button class="ghost" id="scanCancel">Cancel</button>
    <button class="shutter" id="scanShot" aria-label="Capture"></button>
    <button id="scanDone" disabled>Create PDF</button>
  </div>
</div>

<!-- ---------------- document scanner: adjust / crop screen ---------------- -->
<div class="scanui" id="scanCrop">
  <div class="scantop">
    <span class="ttl">Adjust edges</span>
    <span class="pgct" id="cropHint">Drag the corners</span>
  </div>
  <div class="cropwrap" id="cropWrap">
    <canvas class="photo" id="cropPhoto"></canvas>
    <canvas class="loupe" id="loupe" width="120" height="120" aria-hidden="true" hidden></canvas>
    <svg id="cropSvg">
      <polygon id="cropPoly" points="0,0 0,0 0,0 0,0"></polygon>
      <!-- visible grips (g*) + invisible enlarged hit areas (h*) on top,
           so corners are easy to grab with a thumb -->
      <circle id="g0" class="hgrip" r="14"></circle><circle id="g1" class="hgrip" r="14"></circle>
      <circle id="g2" class="hgrip" r="14"></circle><circle id="g3" class="hgrip" r="14"></circle>
      <circle id="h0" class="hhit" r="28" role="button" aria-label="Drag the top left corner"></circle><circle id="h1" class="hhit" r="28" role="button" aria-label="Drag the top right corner"></circle>
      <circle id="h2" class="hhit" r="28" role="button" aria-label="Drag the bottom right corner"></circle><circle id="h3" class="hhit" r="28" role="button" aria-label="Drag the bottom left corner"></circle>
    </svg>
  </div>
  <div class="scanfilters">
    <button id="fltColour" class="on">Colour</button>
    <button id="fltBw">Black &amp; white</button>
    <button id="qStd" class="on">Standard</button>
    <button id="qSmall">Small file</button>
  </div>
  <div class="scanctl">
    <button class="ghost" id="cropRetake">Retake</button>
    <button id="cropUse">Use page</button>
  </div>
</div>

<div class="pgpill" id="pagePill" aria-hidden="true"></div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="spin" id="spin">Working…</div>

<!-- pdf-lib (vendored, offline) — used as the "pen" to draw replacement text/images -->
<script src="./vendor/pdf-lib.min.js"></script>

<!-- MuPDF.js is the core engine; ESM module with WASM (vendored, offline) -->
<!-- App logic lives in an external module so the CSP can forbid inline scripts -->
<script type="module" src="./app.js"></script>
</body>
</html>
