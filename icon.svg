<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Squircle background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d35"/>
      <stop offset="0.45" stop-color="#1a1c22"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff5a4d" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff5a4d" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ff5a4d" stop-opacity="0"/>
    </radialGradient>
    <!-- Document -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#d9dbe2"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2c5cf"/>
      <stop offset="1" stop-color="#9aa0ad"/>
    </linearGradient>
    <!-- Red PDF accent -->
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#e03022"/>
    </linearGradient>
    <!-- Pencil -->
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd66e"/>
      <stop offset="1" stop-color="#ff9d3d"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="pends" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <path fill="url(#bg)" d="M0 280 C0 90 90 0 280 0 L744 0 C934 0 1024 90 1024 280 L1024 744 C1024 934 934 1024 744 1024 L280 1024 C90 1024 0 934 0 744 Z"/>
  <path fill="url(#glow)" d="M0 280 C0 90 90 0 280 0 L744 0 C934 0 1024 90 1024 280 L1024 744 C1024 934 934 1024 744 1024 L280 1024 C90 1024 0 934 0 744 Z"/>
  <!-- top sheen -->
  <path fill="#ffffff" fill-opacity="0.05" d="M0 280 C0 90 90 0 280 0 L744 0 C934 0 1024 90 1024 280 L1024 360 C700 250 324 250 0 360 Z"/>

  <!-- Document -->
  <g filter="url(#ds)">
    <path fill="url(#paper)" d="M300 250 L600 250 L740 390 L740 774 C740 800 720 820 694 820 L300 820 C274 820 254 800 254 774 L254 296 C254 270 274 250 300 250 Z"/>
    <!-- folded corner -->
    <path fill="url(#fold)" d="M600 250 L740 390 L626 390 C612 390 600 378 600 364 Z"/>
  </g>

  <!-- text lines -->
  <g fill="#aeb4c2">
    <rect x="312" y="430" width="300" height="26" rx="13"/>
    <rect x="312" y="486" width="370" height="26" rx="13"/>
    <rect x="312" y="542" width="250" height="26" rx="13"/>
  </g>

  <!-- PDF badge -->
  <g filter="url(#pends)">
    <rect x="300" y="624" width="232" height="96" rx="22" fill="url(#red)"/>
    <text x="416" y="691" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">PDF</text>
  </g>

  <!-- Editing pencil -->
  <g filter="url(#pends)" transform="rotate(45 660 640)">
    <rect x="612" y="360" width="96" height="360" rx="20" fill="url(#pen)"/>
    <rect x="612" y="360" width="96" height="46" rx="20" fill="#5b6472"/>
    <path d="M612 690 L708 690 L660 760 Z" fill="#3a3f49"/>
    <path d="M636 718 L684 718 L660 760 Z" fill="#1d2026"/>
    <rect x="612" y="360" width="30" height="360" rx="14" fill="#ffffff" fill-opacity="0.25"/>
  </g>
</svg>
